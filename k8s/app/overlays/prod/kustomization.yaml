apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
replicas:
  - {name: portfolio-api, count: 3}
patches:
  - target: {kind: HorizontalPodAutoscaler, name: portfolio-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 3}
      - {op: replace, path: /spec/maxReplicas, value: 10}
  - target: {kind: Deployment, name: portfolio-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels: {app: portfolio-api}
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels: {app: portfolio-api}
